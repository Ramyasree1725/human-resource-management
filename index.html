          return matchQuery && matchDept && matchStatus && matchType && matchLocation;

                        <option value="Active">Active</option>
                        <option value="Probation">Probation</option>
                        <option value="On Leave">On Leave</option>
                      </select>
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t">
                    <button type="button" onClick={() => setShowEmpModal(false)} className="px-3.5 py-1.5 bg-slate-100 dark:bg-slate-800 rounded font-medium cursor-pointer">Cancel</button>
                    <button type="submit" className="px-4 py-1.5 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 rounded font-medium cursor-pointer">Save Employee</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Employee Detail Modal */}
          {viewingEmp && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 w-full max-w-md p-5 shadow-2xl space-y-4 text-xs">
                <div className="flex justify-between items-start border-b pb-3">
                  <div>
                    <h3 className="text-base font-semibold text-slate-900 dark:text-white m-0">{viewingEmp.firstName} {viewingEmp.lastName}</h3>
                    <p className="text-slate-400 font-mono m-0 mt-0.5">{viewingEmp.employeeId} • {viewingEmp.designation}</p>
                  </div>
                  <button onClick={() => setViewingEmp(null)} className="text-slate-400 text-sm cursor-pointer">✕</button>
                </div>

                <div className="space-y-2 bg-slate-50 dark:bg-slate-800/50 p-3.5 rounded border border-slate-200 dark:border-slate-700">
                  <div className="flex justify-between"><span className="text-slate-400">Department:</span> <span className="font-medium text-slate-900 dark:text-white">{DEPARTMENTS.find(d => d.id === viewingEmp.departmentId)?.name}</span></div>
                  <div className="flex justify-between"><span className="text-slate-400">Location:</span> <span className="font-medium text-slate-900 dark:text-white">{viewingEmp.location}</span></div>
                  <div className="flex justify-between"><span className="text-slate-400">Email:</span> <span className="font-medium text-slate-900 dark:text-white">{viewingEmp.email}</span></div>
                  <div className="flex justify-between"><span className="text-slate-400">Phone:</span> <span className="font-medium text-slate-900 dark:text-white">{viewingEmp.phone}</span></div>
                  <div className="flex justify-between"><span className="text-slate-400">Employment Type:</span> <span className="font-medium text-slate-900 dark:text-white">{viewingEmp.employmentType}</span></div>
                  <div className="flex justify-between"><span className="text-slate-400">Annual CTC:</span> <span className="font-bold text-slate-900 dark:text-white">{formatCurrency(viewingEmp.salary)}</span></div>
                  <div className="flex justify-between"><span className="text-slate-400">Status:</span> <span className="font-semibold text-slate-900 dark:text-white">{viewingEmp.status}</span></div>
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t">
                  <button onClick={() => { setEditingEmp(viewingEmp); setViewingEmp(null); setShowEmpModal(true); }} className="px-3.5 py-1.5 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 rounded font-medium cursor-pointer">Edit Profile</button>
                  <button onClick={() => setViewingEmp(null)} className="px-3.5 py-1.5 bg-slate-100 dark:bg-slate-800 rounded font-medium cursor-pointer">Close</button>
                </div>
              </div>
            </div>
          )}

          {/* Leave Modal */}
          {showLeaveModal && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 w-full max-w-sm p-5 shadow-2xl space-y-4 text-xs">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-slate-900 dark:text-white text-sm m-0">Apply For Time-Off</h3>
                  <button onClick={() => setShowLeaveModal(false)} className="text-slate-400 text-sm cursor-pointer">✕</button>
                </div>

                <form onSubmit={handleApplyLeave} className="space-y-3">
                  {isHead && (
                    <div>
                      <label className="block text-slate-700 dark:text-slate-300 font-medium mb-1">Employee *</label>
                      <select name="employeeName" className="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 border rounded text-slate-900 dark:text-white outline-none">
                        {employees.map(e => <option key={e.id} value={`${e.firstName} ${e.lastName}`}>{e.firstName} {e.lastName} ({e.employeeId})</option>)}
                      </select>
                    </div>
                  )}

                  <div>
                    <label className="block text-slate-700 dark:text-slate-300 font-medium mb-1">Leave Category</label>
                    <select name="leaveType" className="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 border rounded text-slate-900 dark:text-white outline-none">
                      <option value="Annual Leave">Annual Leave</option>
                      <option value="Sick Leave">Sick Leave</option>
                      <option value="Casual Leave">Casual Leave</option>
                      <option value="Compensatory Off">Compensatory Off</option>
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-700 dark:text-slate-300 font-medium mb-1">Start Date</label>
                      <input name="startDate" type="date" defaultValue="2026-09-05" required className="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 border rounded text-slate-900 dark:text-white outline-none" />
                    </div>
                    <div>
                      <label className="block text-slate-700 dark:text-slate-300 font-medium mb-1">End Date</label>
                      <input name="endDate" type="date" defaultValue="2026-09-07" required className="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 border rounded text-slate-900 dark:text-white outline-none" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-700 dark:text-slate-300 font-medium mb-1">Total Days</label>
                    <input name="days" type="number" defaultValue="3" required className="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 border rounded text-slate-900 dark:text-white outline-none" />
                  </div>

                  <div>
                    <label className="block text-slate-700 dark:text-slate-300 font-medium mb-1">Reason *</label>
                    <textarea name="reason" required placeholder="Reason for time off..." rows="2" className="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 border rounded text-slate-900 dark:text-white outline-none"></textarea>
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t">
                    <button type="button" onClick={() => setShowLeaveModal(false)} className="px-3.5 py-1.5 bg-slate-100 dark:bg-slate-800 rounded font-medium cursor-pointer">Cancel</button>
                    <button type="submit" className="px-4 py-1.5 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 rounded font-medium cursor-pointer">Submit</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Official Payslip Modal */}
          {viewingPayslip && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 w-full max-w-lg p-5 shadow-2xl space-y-4 text-xs">
                <div className="flex justify-between items-start border-b pb-3">
                  <div>
                    <h3 className="text-base font-bold text-slate-900 dark:text-white m-0">StaffBase Solutions Pvt Ltd</h3>
                    <p className="text-slate-400 m-0">Salary Slip - August 2026</p>
                  </div>
                  <button onClick={() => setViewingPayslip(null)} className="text-slate-400 text-sm cursor-pointer">✕</button>
                </div>

                <div className="grid grid-cols-2 gap-2 bg-slate-50 dark:bg-slate-800/50 p-3 rounded">
                  <p className="m-0"><span className="text-slate-400">Employee:</span> <span className="font-semibold">{viewingPayslip.firstName} {viewingPayslip.lastName}</span></p>
                  <p className="m-0"><span className="text-slate-400">ID:</span> <span className="font-mono">{viewingPayslip.employeeId}</span></p>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div className="border p-3 rounded space-y-1">
                    <p className="font-semibold border-b pb-1">Earnings</p>
                    <div className="flex justify-between text-slate-500"><span>Basic (50%):</span> <span>{formatCurrency(Math.round(((viewingPayslip.salary || 0) / 12) * 0.5))}</span></div>
                    <div className="flex justify-between text-slate-500"><span>HRA (20%):</span> <span>{formatCurrency(Math.round(((viewingPayslip.salary || 0) / 12) * 0.2))}</span></div>
                    <div className="flex justify-between text-slate-500"><span>Allowances:</span> <span>{formatCurrency(Math.round(((viewingPayslip.salary || 0) / 12) * 0.3))}</span></div>
                  </div>

                  <div className="border p-3 rounded space-y-1">
                    <p className="font-semibold border-b pb-1">Deductions</p>
                    <div className="flex justify-between text-slate-500"><span>EPF (12%):</span> <span className="text-red-600">- {formatCurrency(Math.round(((viewingPayslip.salary || 0) / 12) * 0.5 * 0.12))}</span></div>
                    <div className="flex justify-between text-slate-500"><span>Prof Tax:</span> <span className="text-red-600">- ₹200</span></div>
                  </div>
                </div>

                <div className="p-3 bg-slate-100 dark:bg-slate-800 font-bold rounded flex justify-between">
                  <span>Net Salary Payable:</span>
                  <span>{formatCurrency(Math.round((viewingPayslip.salary || 0) / 12) - Math.round(((viewingPayslip.salary || 0) / 12) * 0.5 * 0.12) - 200)}</span>
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t">
                  <button onClick={() => window.print()} className="px-3.5 py-1.5 bg-slate-900 text-white rounded font-medium cursor-pointer">Print Slip</button>
                  <button onClick={() => setViewingPayslip(null)} className="px-3.5 py-1.5 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded font-medium cursor-pointer">Close</button>
                </div>
              </div>
            </div>
          )}

          {/* Daily Work Upload Modal */}
          {showWorkModal && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 w-full max-w-md p-5 shadow-2xl space-y-4 text-xs">
                <div className="flex justify-between items-center border-b pb-3">
                  <div>
                    <h3 className="font-bold text-slate-900 dark:text-white text-sm m-0">Upload Daily Work Progress</h3>
                    <p className="text-[11px] text-slate-500 m-0">Log your morning or afternoon tasks to send to the Office Head.</p>
                  </div>
                  <button onClick={() => setShowWorkModal(false)} className="text-slate-400 text-sm cursor-pointer">✕</button>
                </div>

                <form onSubmit={handleUploadWork} className="space-y-3">
                  {isHead && (
                    <div>
                      <label className="block text-slate-700 dark:text-slate-300 font-medium mb-1">Select Employee</label>
                      <select name="employeeId" className="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 border rounded text-slate-900 dark:text-white outline-none">
                        {employees.map(e => <option key={e.id} value={e.employeeId}>{e.firstName} {e.lastName} ({e.employeeId})</option>)}
                      </select>
                    </div>
                  )}

                  <div>
                    <label className="block text-slate-700 dark:text-slate-300 font-medium mb-1">Shift Progress Slot *</label>
                    <select name="slot" className="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 border rounded text-slate-900 dark:text-white outline-none">
                      <option value="MORNING_TO_AFTERNOON">☀️ Morning to Afternoon (First Half: 09:30 AM - 01:30 PM)</option>
                      <option value="AFTERNOON_TO_EOD">🌙 Afternoon to Evening / EOD (Second Half: 02:00 PM - 06:30 PM)</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-slate-700 dark:text-slate-300 font-medium mb-1">Task / Feature Title *</label>
                    <input name="taskTitle" required placeholder="e.g. Core sprint backend integration & test run" className="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 border rounded text-slate-900 dark:text-white outline-none" />
                  </div>

                  <div>
                    <label className="block text-slate-700 dark:text-slate-300 font-medium mb-1">Detailed Description of Work Done *</label>
                    <textarea name="taskDescription" required rows="3" placeholder="Describe the modules worked on, commits, meetings, bug fixes..." className="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 border rounded text-slate-900 dark:text-white outline-none"></textarea>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-700 dark:text-slate-300 font-medium mb-1">Deliverables / PR #</label>
                      <input name="deliverables" placeholder="e.g. PR #415 merged" className="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 border rounded text-slate-900 dark:text-white outline-none" />
                    </div>
                    <div>
                      <label className="block text-slate-700 dark:text-slate-300 font-medium mb-1">Hours Logged</label>
                      <input name="hoursSpent" type="number" step="0.5" defaultValue="4.0" className="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 border rounded text-slate-900 dark:text-white outline-none" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-700 dark:text-slate-300 font-medium mb-1">Blockers / Escalations (Optional)</label>
                    <input name="blockers" placeholder="Enter 'None' or describe blocker" defaultValue="None" className="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 border rounded text-slate-900 dark:text-white outline-none" />
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t">
                    <button type="button" onClick={() => setShowWorkModal(false)} className="px-3.5 py-1.5 bg-slate-100 dark:bg-slate-800 rounded font-medium cursor-pointer">Cancel</button>
                    <button type="submit" className="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded font-medium cursor-pointer">Submit to Head</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Work Review Modal */}
          {reviewingWorkReport && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 w-full max-w-md p-5 shadow-2xl space-y-4 text-xs">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-slate-900 dark:text-white text-sm m-0">Review Work Update</h3>
                  <button onClick={() => setReviewingWorkReport(null)} className="text-slate-400 text-sm cursor-pointer">✕</button>
                </div>

                <div className="bg-slate-50 dark:bg-slate-800 p-3 rounded space-y-1">
                  <p className="font-bold text-slate-900 dark:text-white m-0">{reviewingWorkReport.employeeName} ({reviewingWorkReport.slotLabel})</p>
                  <p className="text-slate-600 dark:text-slate-300 m-0 font-medium">{reviewingWorkReport.taskTitle}</p>
                  <p className="text-slate-500 dark:text-slate-400 m-0">{reviewingWorkReport.taskDescription}</p>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const fd = new FormData(e.target);
                  handleReviewWork(reviewingWorkReport.id, fd.get('feedback'));
                }} className="space-y-3">
                  <div>
                    <label className="block text-slate-700 dark:text-slate-300 font-medium mb-1">Office Head Feedback / Remarks</label>
                    <textarea name="feedback" rows="3" placeholder="Enter remarks, approval note, or next steps..." className="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 border rounded text-slate-900 dark:text-white outline-none"></textarea>
                  </div>

                  <div className="flex justify-end gap-2 pt-2 border-t">
                    <button type="button" onClick={() => setReviewingWorkReport(null)} className="px-3.5 py-1.5 bg-slate-100 dark:bg-slate-800 rounded font-medium cursor-pointer">Cancel</button>
                    <button type="submit" className="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded font-medium cursor-pointer">Mark Reviewed</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
